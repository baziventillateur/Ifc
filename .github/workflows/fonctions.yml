# Redéploie les fonctions d'e-mails quand leurs fichiers changent sur main.
# Nécessite le secret GitHub SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens) ;
# sans lui, rien n'est déployé et un simple avertissement s'affiche.
name: Fonctions Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: gmirbodifgxxnsfyfuyr
    steps:
      - uses: actions/checkout@v4
      - name: Jeton Supabase présent ?
        id: jeton
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Secret SUPABASE_ACCESS_TOKEN absent : fonctions non déployées."
            echo "ok=non" >> "$GITHUB_OUTPUT"
          else
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.jeton.outputs.ok == 'oui'
        with:
          version: latest
      - name: Déployer
        if: steps.jeton.outputs.ok == 'oui'
        run: |
          supabase functions deploy inviter --project-ref "$PROJET"
          supabase functions deploy invitation --project-ref "$PROJET" --no-verify-jwt
          supabase functions deploy courriels --project-ref "$PROJET" --no-verify-jwt
