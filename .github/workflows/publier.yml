name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Envoyer dist/ sur la branche gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publication du site"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # Publication directe par GitHub Pages (réglage Pages > Source : « GitHub Actions »).
      # La branche gh-pages ci-dessus reste alimentée pour l'ancien réglage.
      - name: Retirer le dépôt git temporaire de dist/
        run: rm -rf dist/.git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Déployer sur GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4
