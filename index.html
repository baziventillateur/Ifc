<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1318" />
    <title>NexBim · Maquettes IFC en 3D</title>
    <meta name="description" content="Ouvrez vos maquettes IFC en 3D dans le navigateur, à plusieurs : superposition, coupes, mesures, quantités, clashs et remarques." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexBim · PaceApp" />
    <meta name="author" content="PaceApp" />
    <meta property="og:title" content="NexBim · Maquettes IFC en 3D" />
    <meta property="og:description" content="Vos maquettes IFC en 3D, à plusieurs, dans le navigateur. Clashs, quantités, coupes, remarques." />
    <meta property="og:url" content="https://baziventillateur.github.io/Ifc/" />
    <meta property="og:image" content="https://baziventillateur.github.io/Ifc/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://baziventillateur.github.io/Ifc/partage.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo/nexbim-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
    </script>
  </head>
  <body>
    <div id="scene"></div>
    <div class="etiquettes" id="etiquettes"></div>

    <header class="barre">
      <div class="marque">
        <img class="logo" src="logo.svg" alt="" width="18" height="18" />
        <span class="titre">NexBim</span>
        <span class="sous-titre" id="nom-maquette"></span>
      </div>
      <div class="actions">
        <button id="btn-ajouter" class="btn principal" type="button" title="Ajouter une ou plusieurs maquettes IFC">+ Maquette</button>
        <button id="btn-projet" class="btn" type="button" title="Projet, personnes invitées et compte">Projet</button>
        <button id="btn-recadrer" class="btn" type="button" title="Recadrer la vue">Recadrer</button>
      </div>
      <input id="fichier" type="file" accept=".ifc" multiple hidden />
    </header>

    <nav class="outils" id="outils" aria-label="Outils"></nav>

    <div class="colonne">
      <section class="calques" id="calques" hidden>
        <button class="calques-entete" id="calques-entete" type="button" aria-expanded="true">
          <span id="calques-titre">Maquettes</span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div class="calques-liste" id="calques-liste"></div>
        <div class="calques-pied" id="calques-pied">
          <button class="lien bascule" id="btn-couleurs" type="button" aria-pressed="false" title="Une couleur par lot (structure, CVC, électricité…)">Couleurs par lot</button>
          <button class="lien plusieurs" id="btn-tout-afficher" type="button">Tout afficher</button>
          <button class="lien plusieurs" id="btn-tout-retirer" type="button">Tout retirer</button>
        </div>
      </section>

      <section class="outil" id="outil" hidden aria-live="polite">
        <div class="outil-entete">
          <span id="outil-titre"></span>
          <button class="fermer" id="outil-fermer" type="button" aria-label="Fermer l'outil">✕</button>
        </div>
        <div class="outil-corps" id="outil-corps"></div>
      </section>
    </div>

    <div class="aide" id="aide">
      Tournez avec un doigt, zoomez avec deux. Touchez un élément pour voir ses informations.
    </div>

    <aside class="fiche" id="fiche" aria-live="polite">
      <div class="fiche-entete">
        <div>
          <div class="fiche-categorie" id="fiche-categorie"></div>
          <div class="fiche-nom" id="fiche-nom"></div>
        </div>
        <button class="fermer" id="fiche-fermer" type="button" aria-label="Fermer">✕</button>
      </div>
      <div class="fiche-corps" id="fiche-corps"></div>
    </aside>

    <div class="voile" id="voile">
      <div class="voile-boite">
        <div class="roue"></div>
        <div id="voile-texte">Chargement de la maquette…</div>
        <div class="jauge"><div class="jauge-plein" id="jauge"></div></div>
      </div>
    </div>

    <div class="depot" id="depot">Déposez vos fichiers IFC ici</div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
