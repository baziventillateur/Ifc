<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1318" />
    <title>NexBim · Maquettes IFC en 3D</title>
    <meta name="description" content="Ouvrez vos maquettes IFC en 3D dans le navigateur, à plusieurs : superposition, coupes, mesures, quantités, clashs et remarques." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexBim · PaceApp" />
    <meta name="author" content="PaceApp" />
    <meta property="og:title" content="NexBim · Maquettes IFC en 3D" />
    <meta property="og:description" content="Vos maquettes IFC en 3D, à plusieurs, dans le navigateur. Clashs, quantités, coupes, remarques." />
    <meta property="og:url" content="https://baziventillateur.github.io/Ifc/" />
    <meta property="og:image" content="https://baziventillateur.github.io/Ifc/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://baziventillateur.github.io/Ifc/partage.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo/nexbim-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      // Pas de zoom de la page, comme une appli installée : pincement et double appui sur les menus
      // (iOS ignore la balise viewport, on bloque donc le geste), Ctrl + molette ou pincement du pavé
      // tactile, Ctrl + / Ctrl − / Ctrl 0. Les gestes sur la maquette 3D ne sont pas concernés.
      for (const t of ['gesturestart','gesturechange','gestureend']) document.addEventListener(t, e => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault() }, { passive: false });
      addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault() }, { passive: false });
      addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+','-','=','0','_'].includes(e.key)) e.preventDefault() });
      if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
    </script>
  </head>
  <body>
    <div id="scene"></div>
    <div class="etiquettes" id="etiquettes"></div>

    <header class="barre">
      <div class="marque">
        <img class="logo" src="logo.svg" alt="" width="18" height="18" />
        <a class="griffe" href="https://paceapp.fr" target="_blank" rel="noopener" title="NexBim, une application PaceApp">
          <span class="titre">NexBim</span>
          <span class="griffe-par">by PaceApp</span>
        </a>
        <span class="sous-titre" id="nom-maquette"></span>
      </div>
      <div class="actions">
        <button id="btn-ajouter" class="btn principal" type="button" title="Ajouter une ou plusieurs maquettes IFC">+<span class="long"> Maquette</span></button>
        <button id="btn-projet" class="btn" type="button" title="Projet, personnes invitées et compte">Projet</button>
        <button id="btn-recadrer" class="btn" type="button" title="Recadrer la vue">Recadrer</button>
      </div>
      <input id="fichier" type="file" accept=".ifc" multiple hidden />
    </header>

    <nav class="outils" id="outils" aria-label="Outils"></nav>

    <div class="colonne">
      <section class="calques" id="calques" hidden>
        <button class="calques-entete" id="calques-entete" type="button" aria-expanded="true">
          <span id="calques-titre">Maquettes</span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div class="calques-liste" id="calques-liste"></div>
        <div class="calques-pied" id="calques-pied">
          <button class="lien bascule" id="btn-couleurs" type="button" aria-pressed="false" title="Colorer les maquettes (structure, CVC, électricité…)">Couleurs</button>
          <button class="lien plusieurs" id="btn-tout-afficher" type="button">Tout afficher</button>
          <button class="lien plusieurs" id="btn-tout-retirer" type="button">Tout masquer</button>
        </div>
      </section>

      <section class="outil" id="outil" hidden aria-live="polite">
        <div class="outil-entete">
          <span id="outil-titre"></span>
          <button class="fermer" id="outil-fermer" type="button" aria-label="Fermer l'outil">✕</button>
        </div>
        <div class="outil-corps" id="outil-corps"></div>
      </section>
    </div>

    <div class="aide" id="aide">
      Tournez avec un doigt, zoomez avec deux. Touchez un élément pour voir ses informations.
    </div>

    <button id="btn-oeil" class="btn-oeil" type="button" aria-pressed="false" title="Mode regard : tourner la tête sur place" aria-label="Mode regard">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>

    <button id="btn-projection" class="btn-projection" type="button" aria-label="Projection : perspective ou orthogonale">60°</button>

    <aside class="fiche" id="fiche" aria-live="polite">
      <div class="fiche-poignee" id="fiche-poignee" aria-hidden="true"></div>
      <div class="fiche-entete" id="fiche-entete">
        <div>
          <div class="fiche-categorie" id="fiche-categorie"></div>
          <div class="fiche-nom" id="fiche-nom"></div>
        </div>
        <button class="fermer" id="fiche-fermer" type="button" aria-label="Fermer la fiche">✕</button>
      </div>
      <div class="fiche-corps" id="fiche-corps"></div>
    </aside>

    <div class="voile" id="voile">
      <div class="voile-boite">
        <div class="roue"></div>
        <div id="voile-texte">Chargement de la maquette…</div>
        <div class="jauge"><div class="jauge-plein" id="jauge"></div></div>
      </div>
    </div>

    <div class="depot" id="depot">Déposez vos fichiers IFC ici</div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
